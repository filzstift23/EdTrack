/* Layout: soft glowing canvas, floating white cards. Programmes page = sticky category sidebar + main column (title, stat tiles, search card with collapsible profile/filters, programme rows as separate cards). Colours and logo from the EdTrack pitch deck. */
:root{
  --brand:#13a08b; --brand-ink:#0b7d6c; --brand-soft:#e2f5f1; --mint:#5fd3be; --on-brand:#ffffff;
  --band:#000a3f; --band-fg:#ffffff; --band-muted:#b9c0dc;
  --bg:#f7f8fb; --surface:#ffffff; --surface-2:#f2f4f8; --line:#e3e6ec; --line-2:#c9ced9;
  --fg:#1a1f36; --muted:#5a6275;
  --good:#0b7d6c; --good-soft:#e2f5f1; --warn:#9a6a10; --warn-soft:#fbf1dc; --bad:#c2412d; --bad-soft:#fbe8e4; --info:#2f55b4; --info-soft:#e8eefb;
  --partner:#7a4fb8; --partner-soft:#f2ecfa; --plus:#000a3f; --plus-soft:#e9ebf4;
  --wm-ed:#000a3f; --wm-track:#13a08b;
  --scrim:rgba(0,10,63,.45);
  --shadow:0 1px 2px rgba(0,10,63,.06),0 10px 30px rgba(0,10,63,.10);
  --f-display:Onest,Inter,Arial,system-ui,sans-serif;
  --f-body:Inter,Arial,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-logo:Arial,Helvetica,sans-serif;
  --r:10px;
  --cta:#000a3f; --on-cta:#ffffff;
  --glow1:rgba(95,211,190,.28); --glow2:rgba(47,85,180,.14); --glow3:rgba(95,211,190,.12);
  --row-shadow:0 1px 2px rgba(0,10,63,.04),0 4px 14px rgba(0,10,63,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --brand:#5fd3be; --brand-ink:#6fdcc8; --brand-soft:#0e3a40; --on-brand:#04122a;
  --band:#0a1552; --band-fg:#ffffff; --band-muted:#aab3d6;
  --bg:#050a24; --surface:#0b1335; --surface-2:#111b46; --line:#1d2860; --line-2:#2b3a78;
  --fg:#e8ebf6; --muted:#9ba4c4;
  --good:#6fdcc8; --good-soft:#0e3a40; --warn:#e6b85c; --warn-soft:#35290e; --bad:#ff8f80; --bad-soft:#3d1712; --info:#8fa9f0; --info-soft:#14214f;
  --partner:#c3a3f0; --partner-soft:#261a45; --plus:#c9d0f0; --plus-soft:#141e4e;
  --wm-ed:#ffffff; --wm-track:#5fd3be;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);

  --cta:#5fd3be; --on-cta:#04122a;
  --glow1:rgba(95,211,190,.12); --glow2:rgba(80,110,220,.16); --glow3:rgba(95,211,190,.06);
  --row-shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand:#5fd3be; --brand-ink:#6fdcc8; --brand-soft:#0e3a40; --on-brand:#04122a;
  --band:#0a1552; --band-fg:#ffffff; --band-muted:#aab3d6;
  --bg:#050a24; --surface:#0b1335; --surface-2:#111b46; --line:#1d2860; --line-2:#2b3a78;
  --fg:#e8ebf6; --muted:#9ba4c4;
  --good:#6fdcc8; --good-soft:#0e3a40; --warn:#e6b85c; --warn-soft:#35290e; --bad:#ff8f80; --bad-soft:#3d1712; --info:#8fa9f0; --info-soft:#14214f;
  --partner:#c3a3f0; --partner-soft:#261a45; --plus:#c9d0f0; --plus-soft:#141e4e;
  --wm-ed:#ffffff; --wm-track:#5fd3be;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);

  --cta:#5fd3be; --on-cta:#04122a;
  --glow1:rgba(95,211,190,.12); --glow2:rgba(80,110,220,.16); --glow3:rgba(95,211,190,.06);
  --row-shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.wrap{max-width:1440px;margin:0 auto;padding-inline:20px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--fg)}
.brand img{width:34px;height:34px;flex:none;display:block}
.wm{font-family:var(--f-logo);font-size:23px;letter-spacing:-.01em;font-weight:700;line-height:1}
.wm .ed{color:var(--wm-ed)} .wm .tr{color:var(--wm-track)}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-self:stretch}
.tabs button{background:none;border:0;padding:0 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--brand)}
.tabs .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:var(--on-brand);font-size:11px;margin-left:5px;padding:0 5px}
.bar-r{display:flex;gap:8px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:18px;height:18px}

/* ---------- buttons, badges ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 13px;font-weight:600;text-decoration:none;font-size:13px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.accent{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.sm{padding:4px 10px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)} .badge.info{background:var(--info-soft);color:var(--info)}
.badge.plus{background:var(--plus);color:var(--surface)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-ink);margin:0}

main{padding-block:0 64px}
.body{padding-top:24px}
.band{background:var(--band);color:var(--band-fg)}
.band .hero{padding-block:18px 20px;margin:0}
.band .hero-copy{gap:4px}
.band h1{font-size:clamp(22px,2.6vw,30px)}
.band .lede{font-size:14px}
.band h1{color:var(--band-fg)} .band .lede{color:var(--band-muted)} .band .eyebrow{color:var(--mint)}
.band h1 em{color:var(--mint)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr)}
.hero-copy{display:grid;gap:14px;min-width:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4vw,46px);line-height:1.04;letter-spacing:-.03em;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--brand);position:relative;white-space:nowrap}
h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.02em;height:.09em;border-radius:2px;background:var(--mint);opacity:.55}
.lede{margin:0;color:var(--muted);font-size:15.5px;max-width:58ch}
.panel{color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}

.jbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);gap:2px}
.jbar span{display:block;height:100%}
.st-saved{background:var(--line-2)} .st-applied{background:var(--info)} .st-proc{background:var(--plus)} .st-offer{background:var(--good)} .st-rej{background:var(--bad)}
.jleg{display:flex;flex-wrap:wrap;gap:6px 16px;list-style:none;margin:10px 0 0;padding:0;font-size:12.5px;color:var(--muted)}
.jleg li{display:flex;align-items:center;gap:6px}
.jleg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.jleg b{color:var(--fg);font-variant-numeric:tabular-nums}
.jnext{margin-top:12px;width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--brand-soft);border-radius:10px;padding:9px 12px;color:var(--fg)}
.jnext .cd{margin-left:auto;font-weight:800;color:var(--brand-ink);white-space:nowrap;font-variant-numeric:tabular-nums}


/* ---------- profile + filters panel ---------- */
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.frow{display:grid;grid-template-columns:150px repeat(8,minmax(0,1fr));gap:12px;padding:14px 18px;align-items:end}
.frow + .frow{border-top:1px solid var(--line)}
.ftitle{align-self:center;display:grid;gap:2px;justify-items:start}
.ftitle b{font-size:14.5px}
.ftitle small{color:var(--muted);font-size:11.5px;line-height:1.35}
.ctrl{display:grid;gap:5px;min-width:0}
.ctrl label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl input,.ctrl select{height:36px;width:100%;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:8px;padding:0 10px;font-size:13.5px;font-weight:500;min-width:0}
.ctrl input:focus,.ctrl select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.ctrl.set select{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.withicon{position:relative}
.withicon svg{position:absolute;left:10px;top:50%;width:15px;height:15px;margin-top:-7.5px;color:var(--muted);pointer-events:none}
.withicon input{padding-left:32px}
.fitcell{grid-column:span 3}
.duo{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:4px}
.duo.one{grid-template-columns:1fr}.duo.one input{display:none}
.facts div:last-child:nth-child(odd){grid-column:1/-1}
.fitpills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:36px}
.fp{display:inline-flex;gap:5px;align-items:baseline;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.fp b{font-size:14px}
.fp.good b{color:var(--good)} .fp.mid b{color:var(--info)} .fp.reach b{color:var(--warn)} .fp.bad b{color:var(--bad)}

.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px;max-width:100%}

.linkbtn{border:0;background:none;color:var(--brand-ink);font-weight:600;font-size:12.5px;padding:0}

/* ---------- ledger table ---------- */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
thead th:first-child{border-top-left-radius:14px} thead th:last-child{border-top-right-radius:14px}
th[data-s]{cursor:pointer} th[data-s]:hover{color:var(--fg)}
th .arr{color:var(--brand)}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr.row:hover td{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
.sp{display:flex;align-items:center;gap:12px;border:1px dashed var(--line-2);border-radius:10px;padding:8px 12px;flex-wrap:wrap;max-width:900px}
.sp p{margin:0;flex:1;min-width:200px;white-space:normal;color:var(--muted)}
.sp p b{color:var(--fg)}
.ptag{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--partner);background:var(--partner-soft);border-radius:5px;padding:2px 6px}

/* status pill (native select inside) */
.stp{position:relative;display:inline-flex;align-items:center;border-radius:999px;padding-left:22px;background:var(--surface-2);border:1px solid var(--line-2)}
.stp::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--muted)}
.stp select{appearance:none;-webkit-appearance:none;border:0;background:none;padding:4px 24px 4px 0;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;max-width:160px}
.stp::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg);color:var(--muted);pointer-events:none}
.stp select option{color:var(--fg);background:var(--surface)}
.stp.s-int{background:var(--brand-soft);border-color:transparent}.stp.s-int::before{background:var(--brand)}.stp.s-int select,.stp.s-int::after{color:var(--brand-ink)}
.stp.s-prog{background:var(--info-soft);border-color:transparent}.stp.s-prog::before{background:var(--info)}.stp.s-prog select,.stp.s-prog::after{color:var(--info)}
.stp.s-good{background:var(--good-soft);border-color:transparent}.stp.s-good::before{background:var(--good)}.stp.s-good select,.stp.s-good::after{color:var(--good)}
.stp.s-bad{background:var(--bad-soft);border-color:transparent}.stp.s-bad::before{background:var(--bad)}.stp.s-bad select,.stp.s-bad::after{color:var(--bad)}
.stp.s-none{background:transparent;border-style:dashed}

.pcell{display:flex;gap:10px;align-items:center;min-width:170px;max-width:220px;white-space:normal}
.pcell .school{white-space:normal;line-height:1.3}
.loc{color:var(--muted);font-size:12px;white-space:normal;max-width:190px;line-height:1.3}
.crest{flex:none;width:38px;height:38px;border-radius:9px;background:var(--surface-2);color:var(--plus);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:11.5px;letter-spacing:-.01em}
.crest.lg{width:48px;height:48px;font-size:13px;border-radius:11px}
.school{border:0;background:none;padding:0;font-weight:700;color:var(--fg);text-align:left}
.school:hover{color:var(--brand);text-decoration:underline}
.prog{border:0;background:none;padding:0;text-align:left;color:var(--fg);font-weight:600;font-size:13px;white-space:normal;min-width:190px;max-width:250px;line-height:1.35}
.prog:hover{color:var(--brand-ink);text-decoration:underline}
th.rkc,td.rkc{text-align:center;width:1%;padding-inline:10px}
td.rkc b{font-size:17px;font-weight:700;color:var(--muted)}
td.rkc b.on{color:var(--fg);font-weight:800}
.cell2{display:grid;gap:2px;line-height:1.25}
.cell2 small{color:var(--muted);font-size:11.5px}
.dl small{display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.dl.good .dot{background:var(--good)} .dl.warn .dot{background:var(--warn)} .dl.bad .dot{background:var(--bad)}
.dl.bad b,.dl.bad small{color:var(--bad)} .dl.warn small{color:var(--warn)}
.dl.closed{color:var(--muted)}

.mats{display:grid;gap:5px}
.mtop{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mprog{width:64px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.mprog span{display:block;height:100%;background:var(--good)}
.chips{display:flex;gap:3px;flex-wrap:nowrap}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:5px;padding:0 5px;font-size:10.5px;font-weight:700;line-height:18px;letter-spacing:.02em}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.done::before{content:"✓ "}
.flow{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.flow span{border-radius:5px;background:var(--surface-2);padding:1px 6px;color:var(--fg)}
.flow i{font-style:normal;color:var(--line-2)}

.fit{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px}
.meter{display:inline-flex;gap:2px}
.meter i{width:5px;height:13px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.fit.good{color:var(--good)} .fit.good .meter i{background:var(--good);border-color:var(--good)}
.fit.mid{color:var(--info)} .fit.mid .meter i:nth-child(-n+2){background:var(--info);border-color:var(--info)}
.fit.reach{color:var(--warn)} .fit.reach .meter i:nth-child(1){background:var(--warn);border-color:var(--warn)}
.fit.bad{color:var(--bad)}
.cmpbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);display:grid;place-items:center;font-size:16px;line-height:1;font-weight:700}
.cmpbtn.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
td.notes{white-space:normal;min-width:200px;max-width:260px;color:var(--muted);font-size:12px;line-height:1.4}
.empty{padding:36px;text-align:center;color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend > div{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.legend b{color:var(--fg)}
.legend .dl{display:inline-flex;align-items:center;gap:4px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--surface);z-index:50;transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;border-left:1px solid var(--line);box-shadow:var(--shadow)}
.drawer.open{transform:none}
.dhead{padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;display:grid;gap:12px}
.dtitle{display:flex;gap:12px;align-items:center;padding-right:30px}
.dtitle h2{font-family:var(--f-display);font-size:20px;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.drow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.x{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));background:none;border:0;font-size:24px;color:var(--muted);line-height:1;width:32px;height:32px;border-radius:8px}
.x:hover{background:var(--surface-2)}
.dbody{padding:18px 20px 40px;display:grid;gap:22px}
.dbody h3{font-family:var(--f-display);font-size:15px;margin:0 0 10px;font-weight:700}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0}
.facts div{background:var(--surface);padding:9px 12px}
.facts dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600}
.facts dd small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:grid;gap:12px}
.tline li{position:relative;display:flex;justify-content:space-between;gap:10px}
.tline li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.tline li.past{color:var(--muted)} .tline li.past::before{background:var(--line-2)}
.tline li.next::before{border-color:var(--brand);background:var(--brand)}
.tline li.next b{color:var(--brand-ink)}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checklist button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.checklist button:hover{border-color:var(--brand)}
.tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.tick.on{background:var(--good);border-color:var(--good)}
.checklist .more{margin-left:auto;color:var(--brand);font-size:12px;font-weight:600;white-space:nowrap}
.callout{border-radius:12px;padding:13px 14px;background:var(--surface-2)}
.callout.plus{background:var(--plus-soft)}
.callout.offer{background:var(--good-soft)}
.callout p{margin:4px 0 10px;font-size:13px;color:var(--muted)}
.callout.offer b{color:var(--good)}
.pcards{display:grid;gap:8px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start;background:var(--surface)}
.pcard p{margin:2px 0 8px;font-size:12.5px;color:var(--muted)}
.plogo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:12px;background:var(--c)}

/* ---------- modal ---------- */
.mscrim{position:fixed;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{position:relative;background:var(--surface);border-radius:16px;max-width:620px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal .mh{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.modal .mh .x{top:12px}
.modal h2{font-family:var(--f-display);font-size:21px;margin:4px 0 0}
.modal .mb{padding:16px 20px 20px;display:grid;gap:14px}
.modal ol,.modal ul{margin:6px 0 0;padding-left:20px}.modal li{margin:4px 0}
.qbox{background:var(--brand-soft);border-radius:12px;padding:12px 14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- compare & partners ---------- */
.pagehead{display:grid;gap:8px;margin-bottom:20px}
.pagehead h1{font-size:clamp(28px,3.4vw,38px)}
.costs{display:grid;gap:12px}
.crow{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) auto;gap:12px;align-items:center}
.crow .nm{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.cbar .t{background:var(--brand)} .cbar .l{background:color-mix(in srgb,var(--brand) 40%,var(--surface-2))}
.crow .tot{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.cleg{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:4px}
.cleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cmp td,.cmp th{white-space:normal;vertical-align:top}
.cmp th{text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg)}
.cmp th small{display:block;font-weight:500;color:var(--muted)}
.cmp td:first-child{font-weight:700;color:var(--muted);width:170px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.best{display:inline-block;margin-left:6px;background:var(--good-soft);color:var(--good);border-radius:5px;padding:0 6px;font-size:11px;font-weight:700}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.place{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start}
.place h3{font-family:var(--f-display);margin:0;font-size:16px}
.place p{margin:0;color:var(--muted);font-size:13px}
.place .btn{justify-self:start}
.section-gap{margin-top:20px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:1180px){ .frow{grid-template-columns:repeat(4,minmax(0,1fr))} .ftitle{grid-column:1/-1;display:flex;align-items:baseline;gap:10px} .fitcell{grid-column:1/-1} .ctrl.search{grid-column:span 2} }
@media (max-width:640px){
  .wrap{padding-inline:16px}
  .bar-in{gap:8px;padding-block:6px}
  .tabs{order:3;flex-basis:100%;min-height:40px}
  .bar-r{margin-left:auto}
      .facts{grid-template-columns:1fr}
  .crow{grid-template-columns:1fr auto}
  .crow .cbar{grid-column:1/-1;grid-row:2}
  .frow{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px}
  .ctrl.search{grid-column:1/-1}
  .ftitle{flex-wrap:wrap}
}
@media (prefers-reduced-motion: reduce){ .drawer{transition:none} }

/* ================= soft-card design ================= */
html,body{background:var(--bg)}
body{background:radial-gradient(1100px 620px at 8% -8%,var(--glow1),transparent 62%),radial-gradient(900px 560px at 96% 4%,var(--glow2),transparent 60%),radial-gradient(800px 500px at 50% 100%,var(--glow3),transparent 70%),var(--bg);background-attachment:fixed;font-size:14px}
.bar{background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.bar-in{min-height:64px}
.tabs{justify-content:center;align-self:center;gap:4px}
.tabs button{border:0;border-radius:999px;padding:7px 14px;font-weight:500;color:var(--muted)}
.tabs button.on{color:var(--fg);font-weight:600;background:var(--surface);box-shadow:0 1px 2px rgba(0,10,63,.08)}
.iconbtn{border-radius:999px;background:var(--surface)}
.btn{border-radius:999px;font-weight:500;padding:8px 16px}

.badge{border-radius:999px;padding:2px 9px;font-weight:600}
h1,h2,h3{font-family:var(--f-display)}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:22px;align-items:start;padding-block:22px 0}
.side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:var(--row-shadow);display:grid;gap:4px;max-height:calc(100vh - 100px);overflow:auto}
.sgrp{display:grid;gap:1px}
.sgrp + .sgrp{margin-top:8px}
.slabel{font-size:12px;color:var(--muted);padding:6px 10px 3px}
.sitem{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:none;border-radius:10px;padding:7px 10px;font-size:13.5px;color:var(--fg);text-align:left}
.sitem:hover{background:var(--surface-2)}
.sitem.on{background:var(--surface-2);font-weight:600}
.sitem.sub{padding-left:18px}
.sitem span:last-child{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.sitem .tg{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--plus-soft);color:var(--plus);border-radius:999px;padding:1px 7px}
.sfoot{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;display:grid;gap:2px}
.sbtns{display:grid;gap:6px;margin-top:8px}
.sbtns .btn{justify-content:center;width:100%}

.mainc{min-width:0;display:grid;gap:14px;align-content:start}
.ttl{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3vw,36px);letter-spacing:-.03em;line-height:1.08;margin:2px 0 0;text-wrap:balance}
.ttl em{font-style:normal;color:var(--brand)}
.ttl em::after{display:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--row-shadow);display:grid;gap:2px}
.stat small{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat small i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--brand))}
.stat b{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.scard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--row-shadow);display:grid;gap:12px}
.stop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sbox{flex:1 1 260px;position:relative;min-width:0}
.sbox svg{position:absolute;left:14px;top:50%;width:16px;height:16px;margin-top:-8px;color:var(--muted);pointer-events:none}

.fitline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fitline > span{font-size:12.5px;color:var(--muted)}

.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px}
.rescount{font-size:12.5px}

.tablewrap{overflow-x:auto;background:none;border:0;border-radius:0;padding:0 2px 6px}
table{border-collapse:separate;border-spacing:0 8px;margin-top:-8px}
thead th{background:none;border:0;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500;color:var(--muted);padding:6px 12px 0}
thead th:first-child,thead th:last-child{border-radius:0}

const profileSet=()=>{const pr=state.profile;return pr.atest!=='none'||!!pr.budget||pr.etest!=='none'};
function fit(p){
  const pr=state.profile;
  if(!profileSet()) return {t:'Add profile',c:'none',why:['Add your test scores and budget under “Your profile” to compare them with the published minimums'],over:false};
  const why=[]; let test=false; const s=parseInt(pr.gmat);
  if(pr.atest==='none'){ if(p.gmatPolicy==='required'){test=true;why.push('GMAT/GRE required')} else if(p.gmatPolicy==='alt') why.push('needs GMAT/GRE or the school\'s own test'); }
  else if(pr.atest==='gmat'&&GMATMIN[p.id]){ if(isNaN(s)) why.push(`published GMAT minimum ${GMATMIN[p.id]}`); else if(s<GMATMIN[p.id]){test=true;why.push(`GMAT below published minimum ${GMATMIN[p.id]}`)} }
  else if(pr.atest==='gre'&&GMATMIN[p.id]) why.push('check the GRE minimum in the details');
  const ec=engCheck(p); if(!ec.ok){test=true;why.push(ec.why)}
  const over=!!pr.budget&&p.tuition!=null&&p.tuition>pr.budget; if(over) why.push(`tuition ${tuiTxt(p)} above your budget`);
  if(pr.budget&&p.tuition==null) why.push('tuition not published');
  if(over) return {t:'Over budget',c:'bad',why,over};
  if(p.gmatPolicy==='unknown') return {t:'Check school',c:'none',why:['requirements not published yet',...why],over};
  if(test) return {t:'Test needed',c:'reach',why,over};
  if(p.gmatPolicy==='alt'&&pr.atest==='none') return {t:'School test',c:'mid',why,over};
  return {t:'Meets minimums',c:'good',why,over};
}

/* plain-language summary of what an applicant has to produce */
function essaySum(p){
  const kind=e=>/video|visiotalent/i.test(e.label)?'video':/interview/i.test(e.label)?'int':/letter|statement/i.test(e.label)?'letter':'essay';
  const it=p.essays.map(e=>({...e,k:kind(e)}));
  const es=it.filter(e=>e.k==='essay'), le=it.filter(e=>e.k==='letter'), vi=it.filter(e=>e.k==='video'), iq=it.filter(e=>e.k==='int');
  const W=[...le,...es];
  if(!it.length) return p.essaySrc==='portal'?{main:'Not published',sub:p.gmatPolicy==='unknown'?'not published yet':'questions not public',none:true}:{main:'Nothing to write',sub:'no essays or letter',none:true};
  const opt=e=>/optional/i.test(e.label);
  const parts=[];
  if(le.length) parts.push(le[0].label.split(/\s*[\/(]/)[0]);
  const req=es.filter(e=>!opt(e)), op=es.length-req.length;
  if(req.length) parts.push(req.length===1?(/^essays/i.test(req[0].label)?'Essays':'1 essay'):`${req.length} essays`);
  if(op) parts.push(`${op} optional`);
  if(vi.length) parts.push(opt(vi[0])?(parts.length?'optional video':'Optional video'):(parts.length?'video':'Video only'));
  if(!parts.length&&iq.length) parts.push('Interview questions');
  const short=l=>l.split(/[,;(]/)[0].trim().replace(/^No limit published.*/i,'no length limit');
  let sub='';
  const w=W.map(e=>{const m=e.limit.match(/^(max\. |~)?([\d,]+) words$/);return m?[m[1]==='~'?'~':'',parseInt(m[2].replace(',',''))]:null});
  if(W.length>1&&w.every(Boolean)){const t=w.reduce((a,x)=>a+x[1],0);sub=`${w.some(x=>x[0])?'~':''}${t.toLocaleString('en-GB')} words in total`;}
  else if(W.length>1&&W.every(e=>e.limit===W[0].limit)) sub=`${W[0].limit} each`;
  else if(W.length===1) sub=short(W[0].limit);
  else if(vi.length) sub=/\d/.test(vi[0].limit)?short(vi[0].limit):'recorded video';
  else if(iq.length) sub=short(iq[0].limit);
  if(W.length&&vi.length&&/\d/.test(vi[0].limit)) sub+=` · video: ${short(vi[0].limit).replace(/^max\. /,'').replace(/^./,c=>c.toLowerCase())}`;
  return {main:parts.join(' + ').replace(/^./,c=>c.toUpperCase()),sub};
}

  const sel=(id,label,cur,opts)=>`<div class="ctrl ${cur!=='all'?'set':''}"><label for="${id}">${label}</label><select id="${id}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
  $('#app').innerHTML=`
  <div class="wrap shell">
    <section class="mainc">
      <h1 class="ttl">Every master's application, <em>on one track.</em></h1>
      <nav class="typebar" id="typebar" aria-label="Programme type"></nav>
      <section class="scard" aria-label="Search, profile and filters">
        <div class="stop">
          <label class="sbox"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg><input type="search" id="q" placeholder="Search school, programme or city…" value="${esc(state.q)}" aria-label="Search"></label>
          <button class="tgl" id="tProfile" aria-expanded="${state.showProfile}" aria-controls="pPanel"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="7" r="3.2"/><path d="M3.5 17c1.2-3 3.7-4.5 6.5-4.5s5.3 1.5 6.5 4.5"/></svg>Your profile</button>
          <button class="tgl" id="tFilters" aria-expanded="${state.showFilters}" aria-controls="fPanel"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 5h14M6 10h8M8.5 15h3"/></svg>Filters<span class="n" id="fN" hidden></span></button>
        </div>
        <div id="pPanel" ${state.showProfile?'':'hidden'}>
          <div class="pgrid">
            <div class="ctrl"><label for="pAtest">Admissions test</label><div class="duo ${pr.atest==='gmat'?'':'one'}"><select id="pAtest">${Object.entries(ATESTS).map(([k,l])=>`<option value="${k}" ${pr.atest===k?'selected':''}>${l}</option>`).join('')}</select><input class="num" id="pGmat" inputmode="numeric" aria-label="GMAT Focus score" value="${esc(pr.gmat)}" placeholder="e.g. 615"></div></div>
            <div class="ctrl"><label for="pEtest">English test</label><div class="duo ${['waiver','none'].includes(pr.etest)?'one':''}"><select id="pEtest">${Object.entries(ETESTS).map(([k,l])=>`<option value="${k}" ${pr.etest===k?'selected':''}>${l}</option>`).join('')}</select><input class="num" id="pEscore" inputmode="decimal" aria-label="English test score" value="${esc(pr.escore||'')}" placeholder="${pr.etest==='toefl'?'e.g. 105 or 5.0':'e.g. 7.5'}"></div></div>
            <div class="ctrl"><label for="pBudget">Tuition budget in ${state.cur} (optional)</label><input class="num" id="pBudget" inputmode="numeric" value="${pr.budget?Math.round(pr.budget*FX[state.cur]):''}" placeholder="e.g. ${Math.round(40000*FX[state.cur]/1000)*1000}"></div>
            <div class="ctrl" style="grid-column:1/-1"><label>Your fit across ${P.length} programmes</label><div class="fitpills" id="fitsum"></div></div>
          </div>
          <div class="sfoot2" style="margin-top:10px"><span>Fit compares your profile only with what schools publish: admissions test, English minimum and tuition. Degree and grade requirements are not checked. Saved in this browser only.</span></div>
        </div>
        <div id="fPanel" ${state.showFilters?'':'hidden'}>
          <div class="fgrid">
            ${sel('fStatus','My status',state.fStatus,[['all','Any status'],...STATUSES.map(s=>[s,s])])}
            ${sel('fOpen','Application window',state.fOpen,[['all','Any'],['open','Open now'],['soon','Deadline within 30 days']])}
            ${sel('fElig','My fit',state.fElig,[['all','Any'],['eligible','Meets minimums or school test'],['budget','Within my tuition budget']])}
            ${sel('fGmat','GMAT / GRE',state.fGmat,[['all','Any'],['required','Required'],['flex','Not strictly required']])}
            ${sel('fEng','English test',state.fEng,[['all','Any'],['meets','Meets my score'],['waiver','Waiver possible'],['none','No minimum published']])}
            ${sel('fEss','Essays',state.fEss,[['all','Any'],['none','No written essays'],['written','Written essays']])}
            <div class="ctrl"><label for="sort">Sort by</label><select id="sort">${[['ft','Default order'],['deadline','Next deadline'],['tuition','Tuition (low to high)'],['school','School A–Z']].map(([v,l])=>`<option value="${v}" ${state.sort===v?'selected':''}>${l}</option>`).join('')}</select></div>
          </div>
          <div class="sfoot2" style="margin-top:10px"><button class="linkbtn" id="reset">Reset filters</button><span id="fState"></span></div>
        </div>
      </section>
      <div class="listhead"><span class="rescount" id="rescount"></span></div>
      <div class="swipe">Swipe the table sideways to see all columns →</div>
      <div class="tablewrap"><table id="tbl"></table></div>
      <div class="legend">
        <div><b>Deadline</b> <span class="dl warn"><small>orange</small></span> ≤ 30 days · <span class="dl bad"><small>red</small></span> ≤ 7 days · hover for the full round name</div>
        <div><b>Essays</b> what you have to write and how long · click to read every question · <span class="srct official">Official</span> from the school's website · <span class="srct reported">Reported</span> by last year's applicants, check in the portal · <span class="srct portal">Portal only</span> questions not public</div>
        <div><b>English</b> TOEFL shows the 0–120 score and, where a school lists it, the 1–6 scale used since 2026 · <b>Tuition</b> EU/EEA rate for the whole programme · ≈ converted at the ECB rate of ${fmtD(FXDATE)}</div>
        <div><b>Materials</b> CV · TR transcripts · DIP degree · GMAT/TEST admissions test · EN English · ML motivation letter · ES essays · VID video · REF references · FEE fee · ID passport</div>
      </div>
    </section>
  </div>`;
  $('#tProfile').onclick=()=>{state.showProfile=!state.showProfile;$('#pPanel').hidden=!state.showProfile;$('#tProfile').setAttribute('aria-expanded',state.showProfile)};
  $('#tFilters').onclick=()=>{state.showFilters=!state.showFilters;$('#fPanel').hidden=!state.showFilters;$('#tFilters').setAttribute('aria-expanded',state.showFilters)};
  const bind=(id,key)=>{$(id).addEventListener(id==='#q'?'input':'change',e=>{state[key]=e.target.value; if(id!=='#q') e.target.closest('.ctrl')?.classList.toggle('set',e.target.value!=='all'&&key!=='sort'); drawTable()})};
  bind('#q','q'); bind('#fStatus','fStatus'); bind('#fOpen','fOpen'); bind('#fElig','fElig'); bind('#fGmat','fGmat'); bind('#fEng','fEng'); bind('#fEss','fEss'); bind('#sort','sort');
  $('#reset').onclick=()=>{Object.assign(state,{tab:'all',q:'',fStatus:'all',fOpen:'all',fGmat:'all',fEng:'all',fEss:'all',fElig:'all',fCountry:'all',sort:'ft',showFilters:true});renderTracker()};
  $('#pAtest').onchange=e=>{pr.atest=e.target.value;if(pr.atest!=='gmat')pr.gmat='';save('profile',pr);renderTracker()};
  $('#pGmat').oninput=e=>{pr.gmat=e.target.value;save('profile',pr);drawTable()};
  $('#pBudget').oninput=e=>{const v=parseInt(e.target.value.replace(/\D/g,''));pr.budget=v?v/FX[state.cur]:'';save('profile',pr);drawTable()};
  $('#pEtest').onchange=e=>{pr.etest=e.target.value;pr.escore='';save('profile',pr);renderTracker()};
  $('#pEscore').oninput=e=>{pr.escore=e.target.value;save('profile',pr);drawTable()};
  drawTable();
}

const TABS=[['all','All programmes'],['mim','Masters in Management'],['fin','Masters in Finance'],['cems','CEMS track'],['open','Open now'],['mine','My list']];
function tabOk(p,k){ const n=nextRound(p);
  return k==='mim'?p.type==='mim':k==='fin'?p.type==='fin':k==='cems'?/CEMS/.test(p.prog):k==='open'?(portalOpen(p)&&!!n):k==='mine'?!!state.tracker[p.id]:true; }
function drawTypes(){
  const it=([k,l])=>`<button class="tb ${state.tab===k?'on':''}" data-tab="${k}" aria-pressed="${state.tab===k}">${l}<span>${P.filter(p=>tabOk(p,k)).length}</span></button>`;
  $('#typebar').innerHTML=[['all','All programmes'],['mim','Management'],['fin','Finance'],['cems','CEMS'],['mine','My list']].map(it).join('');
}
function drawSummary(){
  drawTypes();
  const open=P.filter(p=>tabOk(p,'open')).length, soon=P.filter(p=>{const r=nextRound(p);return portalOpen(p)&&r&&r[1]&&days(r[1])<=30}).length;
  if($('#stats')) $('#stats').innerHTML=[['Programmes listed',P.length,'var(--plus)'],['Open now',open,'var(--brand)'],['Deadline ≤ 30 days',soon,'var(--warn)'],['On your list',Object.keys(state.tracker).length,'var(--good)']]
    .map(([l,v,c])=>`<div class="stat"><small><i style="--c:${c}"></i>${l}</small><b>${v}</b></div>`).join('');
  const active=['fStatus','fOpen','fElig','fGmat','fEng','fEss'].filter(k=>state[k]!=='all').length;
  $('#fN').textContent=active; $('#fN').hidden=!active;
  $('#fState').textContent=active?`${active} filter${active>1?'s':''} active`:'No filters active';
  const f=P.map(fit); const n=c=>f.filter(x=>x.c===c).length;
  $('#fitsum').innerHTML=profileSet()?[['good','meet minimums'],['mid','school test'],['reach','test needed'],['bad','over budget']].map(([c,l])=>`<span class="fp ${c}"><b class="num">${n(c)}</b>${l}</span>`).join(''):'<span class="fp">Add a test, an English score or a budget to see your fit</span>';
}
const rnum = v=>{const n=parseInt(String(v).replace('=',''));return isNaN(n)?999:n};
function nextRound(p){ const r=p.rounds.find(r=>r[1]&&days(r[1])>=0); if(r) return r; return p.rounds.find(r=>r[1]===null)||null; }
function portalOpen(p){ return !(p.opens&&days(p.opens)>0) && p.rounds.length>0; }
/* short round tag for the table: "Round 2" -> "R2", "Session 1" -> "S1"; long labels stay in the tooltip */
function roundTag(l){ l=l.replace(/\s*\(.*\)/,'');
  let m=l.match(/^(Round|Session|Stage)\s+([0-9IVX]+)$/i); if(m) return m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+' '+({I:1,II:2,III:3,IV:4,V:5}[m[2].toUpperCase()]||m[2]);
  if(/^Monthly/i.test(l)) return 'Monthly'; return l.length<=20?l:''; }
function deadlineCell(p){
  const n=nextRound(p); const tip=esc(p.roundsNote||'');
  if(p.opens&&days(p.opens)>0) return `<div class="dl closed cell2" title="${tip}"><b>Opens ${p.opensTxt||fmtDM(p.opens)}</b>${n&&n[1]?`<small>1st deadline ${fmtDM(n[1])}</small>`:''}</div>`;
  if(!p.rounds.length) return `<div class="dl closed cell2" title="${tip||'Not published yet'}"><b>Not published</b></div>`;
  if(!n) return `<div class="dl closed cell2" title="${tip}"><b>Closed</b></div>`;
  if(!n[1]) return `<div class="dl cell2" title="${esc(n[0])}${tip?' · '+tip:''}"><b>Rolling</b></div>`;
  const d=days(n[1]); const c=d<=7?'bad':d<=30?'warn':'good';
  return `<div class="dl ${c} cell2" title="${esc(n[0])}"><b class="num">${fmtS(n[1])}</b><small>${[esc(roundTag(n[0])),dTxt(d)].filter(Boolean).join(' · ')}</small></div>`;
}
const COLS=11;
function drawTable(){
  drawSummary();
  let r=P.filter(p=>{
    const q=state.q.toLowerCase(); const st=statusOf(p.id); const f=fit(p); const n=nextRound(p);
    if(q && !(p.prog+' '+p.school+' '+p.short+' '+p.city+' '+p.country).toLowerCase().includes(q)) return false;
    if(!tabOk(p,state.tab)) return false;
    if(state.fStatus!=='all' && st!==state.fStatus) return false;
    if(state.fOpen==='open' && !(portalOpen(p) && n)) return false;
    if(state.fOpen==='soon' && !(portalOpen(p) && n && n[1] && days(n[1])<=30)) return false;
    if(state.fElig==='eligible' && !['good','mid'].includes(f.c)) return false;
    if(state.fElig==='budget' && (f.over||p.tuition==null)) return false;
    if(state.fGmat==='required' && p.gmatPolicy!=='required') return false;
    if(state.fGmat==='flex' && ['required','unknown'].includes(p.gmatPolicy)) return false;
    if(state.fEng==='meets' && !engCheck(p).ok) return false;
    if(state.fEng==='waiver' && !p.en.waiver) return false;
    if(state.fEng==='none' && hasEngMin(p)) return false;
    if(state.fEss==='none' && p.essays.some(e=>!/video/i.test(e.label))) return false;
    if(state.fEss==='written' && !p.essays.some(e=>!/video/i.test(e.label))) return false;
    if(state.fCountry!=='all' && p.country!==state.fCountry) return false;
    return true;
  });
  const s=state.sort;
  const dl=p=>{const n=nextRound(p);return n&&n[1]?days(n[1]):n?998:999};
  const tu=p=>p.tuition==null?1e9:p.tuition;
  r.sort((a,b)=> s==='deadline'?dl(a)-dl(b) : s==='tuition'?tu(a)-tu(b) : s==='school'?a.school.localeCompare(b.school) : (rnum(a.ft)-rnum(b.ft))||(a.type<b.type?1:-1));
  $('#rescount').innerHTML=`Showing <b>${r.length}</b> of ${P.length} programmes`;
  const row=p=>{const t=state.tracker[p.id]; const f=fit(p); const keys=p.docs.map(d=>d.split(':')[0]); const done=keys.filter(k=>t&&t.docs[k]).length; const on=state.compare.includes(p.id);
    const offer=['Offer received','Offer accepted'].includes(statusOf(p.id));
    return `<tr class="row">
      <td>${statusSel(p.id)}</td>
      <td><div class="pcell"><div style="min-width:0"><button class="school" data-open="${p.id}">${esc(sname(p))}</button><div class="loc">${p.flag} ${esc(p.city)}</div></div></div></td>
      <td><button class="prog" data-open="${p.id}">${esc(p.prog)}</button><div class="pmeta"><span class="typ ${p.type}">${typeTxt(p)}</span>${p.months?`<span>${p.months} months</span>`:''}</div></td>
      <td>${deadlineCell(p)}</td>
      <td>${essayCell(p)}</td>
      <td><div class="cell2"><b>${GMATTXT[p.gmatPolicy]}</b>${GMATMIN[p.id]?`<small class="num">GMAT min. ${GMATMIN[p.id]}</small>`:''}</div></td>
      <td>${engCell(p)}</td>
      <td><div class="cell2 num"><b>${tuiTxt(p)}</b><small>${p.tuition&&priceOrig(p,'tuition')?priceOrig(p,'tuition')+' · ':''}${feeTxt(p)}</small></div></td>
      <td>${keys.length?`<div class="mats"><div class="mtop"><span class="mprog"><span style="width:${done/keys.length*100}%"></span></span>${done}/${keys.length} ready</div><div class="chips">${keys.map(k=>`<button class="chip ${t&&t.docs[k]?'done':''}" data-doc="${p.id}|${k}" title="${esc(docLabel(p,k))}">${(DOCS[k]||[k.toUpperCase()])[0]}</button>`).join('')}</div></div>`:'<span class="muted small">Not published</span>'}</td>
      <td><button class="cmpbtn ${on?'on':''}" data-cmp="${p.id}" aria-pressed="${on}" title="${on?'Remove from compare':'Add to compare'}" aria-label="${on?'Remove from compare':'Add to compare'}">${on?'✓':'+'}</button></td>
      <td class="act">${offer?`<a class="applyb ghost" href="${p.url}" target="_blank" rel="noopener">Official ↗</a>`:`<a class="applyb" href="${p.apply}" target="_blank" rel="noopener" title="${p.applyInfo?'Opens the school\'s page that explains how to apply':'Opens the school\'s application page'}">${p.applyInfo?'<span class="al">How to apply</span><span class="as">Info</span> ↗':'Apply ↗'}</a>`}</td></tr>`};
  const th=(k,l,t,c)=>`<th data-s="${k}" ${c?'class="rkc"':''} title="${t}" aria-sort="${state.sort===k?'ascending':'none'}">${l}${state.sort===k?' <span class="arr">↓</span>':''}</th>`;
  const mine=state.tab==='mine'&&!Object.keys(state.tracker).length;
  $('#tbl').innerHTML=`<thead><tr><th>Status</th>${th('school','School','Sort A–Z')}<th>Programme</th>${th('deadline','Deadline','Next deadline · click to sort')}<th>What to write</th><th>Admissions test</th><th title="Minimum English test score">English</th>${th('tuition','Tuition (EU)','EU/EEA tuition for the whole programme · click to sort')}<th>Materials</th><th>Compare</th><th></th></tr></thead>
    <tbody>${r.map(row).join('')||`<tr><td colspan="${COLS}" class="empty">${mine?'Your list is empty. Set a status or tick a material on any programme and it is added here.':'No programmes match these filters.'} <button class="linkbtn" onclick="document.getElementById('reset').click()">${mine?'Show all programmes':'Reset filters'}</button></td></tr>`}</tbody>`;
}
function docLabel(p,k){ const d=p.docs.find(x=>x.split(':')[0]===k)||''; return d.includes(':')?d.slice(d.indexOf(':')+1):(DOCS[k]?DOCS[k][1]:k); }

function ensure(id){ if(!state.tracker[id]) state.tracker[id]={status:'Not Applied',docs:{}}; }
function prune(id){ const t=state.tracker[id]; if(t&&t.status==='Not Applied'&&!t.saved&&!Object.values(t.docs).some(Boolean)) delete state.tracker[id]; }
function toggleSaved(id){ const p=P.find(x=>x.id===id); if(state.tracker[id]){ delete state.tracker[id]; toast(`${sname(p)} removed from your to-dos`); } else { ensure(id); state.tracker[id].status='Interested'; toast(`${sname(p)} added to your to-dos`); } save('tracker',state.tracker); rerender(); if(state.drawer===id) openDrawer(id); }
function tickDoc(id,k){ ensure(id); const t=state.tracker[id]; if(state.view==='todos') t.saved=true; t.docs[k]=!t.docs[k]; prune(id); save('tracker',state.tracker); rerender(); if(state.drawer===id) openDrawer(id); }
function setStatus(id,s){
  ensure(id); state.tracker[id].status=s;
  prune(id);
  save('tracker',state.tracker);
  toast(s==='Interested'?`${sname(P.find(x=>x.id===id))} added to your to-dos`:`${sname(P.find(x=>x.id===id))}: ${s}`);
  rerender(); if(state.drawer===id) openDrawer(id);
}
function toggleCmp(id){ const c=state.compare; const on=c.includes(id);
  if(!on){ if(c.length>=4){toast('Compare holds up to 4 programmes');return} c.push(id); toast(`${sname(P.find(x=>x.id===id))} added to compare`)}
  else state.compare=c.filter(x=>x!==id);
  save('compare',state.compare); rerender(); }
function counts(){ const n=state.compare.length; const el=$('#cmpN'); el.textContent=n; el.hidden=!n; const m=Object.keys(state.tracker).length, t=$('#todoN'); t.textContent=m; t.hidden=!m; $('#nav [data-v="todos"]').hidden=!m; }

/* ---------- material detail ---------- */
function openDoc(pid,key){
  delete $('#modal').dataset.acct;
  const p=P.find(x=>x.id===pid), t=state.tracker[pid]; const done=t&&t.docs[key]; const info=DOCS[key]||[key,key,''];
  let detail='';
  if(key==='gmat'||key==='test') detail=`<p><b>${GMATTXT[p.gmatPolicy]}.</b> ${esc(p.gmatNote||'')}</p>`;
  else if(key==='english') detail=`<p><b>${engTxt(p)}.</b> ${esc(p.en.note||'')}</p>`;
  else if(key==='fee') detail=`<p><b>${p.fee==null?'Not stated':p.fee===0?'No application fee':price(p,'fee')}${priceOrig(p,'fee')?` (${priceOrig(p,'fee')})`:''}</b>${p.feeNote?` · ${esc(p.feeNote)}`:''}</p>`;
  else if(['essays','motivation','video'].includes(key)) detail=essayList(p);
  else detail=`<p>${esc(info[2])}</p>`;
  $('#modal').innerHTML=`<div class="mh"><button class="x" data-close="doc" aria-label="Close">×</button>
    <div class="small muted">${p.flag} ${esc(p.school)} · ${esc(p.prog)}</div><h2>${esc(docLabel(p,key))}</h2></div>
    <div class="mb">${detail}
      <div class="drow"><button class="btn ${done?'':'cta'}" id="markDoc">${done?'✓ Ready':'Mark as ready'}</button>
      <a class="btn" href="${p.url}" target="_blank" rel="noopener">Source page ↗</a></div>
      <p class="small muted" style="margin:0">Checked on the school's official page on ${fmtD(CHECKED)}.</p>
    </div>`;
  $('#mscrim').hidden=false;
  $('#markDoc').onclick=()=>{ ensure(pid); const tr=state.tracker[pid]; tr.docs[key]=!tr.docs[key];
    prune(pid);
    save('tracker',state.tracker); openDoc(pid,key); rerender(); if(state.drawer===pid) openDrawer(pid); };
}
function closeDoc(){$('#mscrim').hidden=true; delete $('#modal').dataset.acct;}
$('#mscrim').addEventListener('click',e=>{if(e.target.id==='mscrim')closeDoc()});

/* ---------- programme drawer ---------- */
function openDrawer(id){
  state.drawer=id;
  const p=P.find(x=>x.id===id); const t=state.tracker[id]; const f=fit(p); const nx=nextRound(p);
  const met=state.profile.etest!=='none'&&hasEngMin(p)&&engCheck(p).ok;
  $('#drawer').innerHTML=`<div class="dhead"><button class="x" data-close="drawer" aria-label="Close">×</button>
    <div class="dtitle"><div><div class="small muted">${p.flag} ${esc(p.school)} · ${esc(p.city)}</div><h2>${esc(p.prog)}</h2></div></div>
    <div class="drow">${statusSel(id,'d')}<a class="btn sm cta" href="${p.apply}" target="_blank" rel="noopener">${applyLbl(p)}</a><button class="btn sm" data-save="${id}">${state.tracker[id]?'✓ On my to-dos':'+ Interested'}</button><button class="btn sm" data-cmp="${id}">${state.compare.includes(id)?'✓ In compare':'+ Compare'}</button></div></div>
  <div class="dbody">
    <dl class="facts">
      <div><dt>Tuition</dt><dd class="num">${tuiTxt(p)}${p.tuition&&priceOrig(p,'tuition')?` <span class="muted" style="font-weight:500">${priceOrig(p,'tuition')}</span>`:''}<small>${esc(p.tuitionNote||'whole programme, EU/EEA rate')}</small></dd></div>
      <div><dt>Application fee</dt><dd class="num">${p.fee==null?'Not stated':p.fee===0?'None':price(p,'fee')}<small>${esc([p.fee?priceOrig(p,'fee'):'',p.feeNote||''].filter(Boolean).join(' · '))}</small></dd></div>
      <div><dt>Admissions test</dt><dd>${GMATTXT[p.gmatPolicy]}<small>${esc(p.gmatNote||'')}</small></dd></div>
      <div><dt>English test (min.)</dt><dd class="num">${engTxt(p)}<small>${esc(p.en.note||'')}${met?' · ✓ your score meets it':''}</small></dd></div>
      <div><dt>Length · intake</dt><dd>${p.months?p.months+' months':'Not stated'}<small>${p.intake}</small></dd></div>
      <div><dt>My fit</dt><dd>${fitHtml(f)}<small>${esc(f.why.join(' · ')||FITOK)}</small></dd></div>
    </dl>
    <section><h3>What you need to write</h3>${essayList(p)}</section>

  if(/already registered|already exists/i.test(m)) return 'There is already an account with this email. Log in instead.';
  if(/password/i.test(m)&&/(6|8|characters|weak)/i.test(m)) return 'Please choose a longer password (at least 8 characters).';
  if(/rate limit|too many/i.test(m)) return 'Too many attempts. Please wait a minute and try again.';
  if(/fetch|network|load failed/i.test(m)||e instanceof TypeError) return 'Could not reach the account server. Please check your connection and try again.';
  return m||'Something went wrong. Please try again.';};
function openAcct(v){ acctView=v||(user?'account':'login'); $('#modal').dataset.acct='1'; drawAcct(); $('#mscrim').hidden=false; }
function drawAcct(){
  const v=acctView, here=location.href.split('#')[0];
  const field=(id,l,t,ac,ph='')=>`<div class="ctrl"><label for="${id}">${l}</label><input id="${id}" type="${t}" autocomplete="${ac}" placeholder="${ph}"></div>`;
  const msg=`<p class="amsg" id="amsg" role="status"></p>`;
  const notReady=!acctReady()?`<p class="anote">Accounts are not connected yet. They start working once the Supabase project is set up and its keys are added to the site.</p>`:'';
  let h='';
  if(v==='account'&&user){
    h=`<h2>Your account</h2></div><div class="mb">
      <p style="margin:0">Logged in as <b>${esc(user.email)}</b>. Your profile, statuses, checklists, compare list and currency are saved to your account and follow you to every device where you log in.</p>
      <p class="small muted" style="margin:0">${esc(syncMsg||'Changes are saved automatically.')}</p>
      <div class="drow"><button class="btn" id="aOut">Log out</button><button class="btn" id="aDel1">Delete account</button></div>
      <div id="aDelBox" hidden class="callout"><b>Delete your account?</b><p>This permanently deletes your login and everything saved in your account. Your list stays in this browser until you clear it.</p><button class="btn sm" id="aDel2" style="border-color:var(--bad);color:var(--bad)">Yes, delete my account</button></div>
      ${msg}</div>`;
  } else if(v==='signup'){
    h=`<h2>Create an account</h2></div><div class="mb">${notReady}
      <p class="small muted" style="margin:0">Free. Saves your profile and your status at every school so you can pick up on any device.</p>
      <form id="aForm" class="aform">${field('aEmail','Email','email','email','you@example.com')}${field('aPw','Password (at least 8 characters)','password','new-password')}
      <button class="btn cta" type="submit">Create account</button></form>
      <p class="small muted" style="margin:0">We store your email and your EdTrack list for this purpose only. See <button class="linkbtn" data-go="about" data-anchor="privacy">Privacy</button>.</p>
      ${msg}<p class="small" style="margin:0">Already have an account? <button class="linkbtn" data-av="login">Log in</button></p></div>`;
  } else if(v==='reset'){
    h=`<h2>Reset your password</h2></div><div class="mb">${notReady}
      <form id="aForm" class="aform">${field('aEmail','Email','email','email','you@example.com')}<button class="btn cta" type="submit">Send reset link</button></form>
      ${msg}<p class="small" style="margin:0"><button class="linkbtn" data-av="login">Back to log in</button></p></div>`;
  } else if(v==='newpw'){
    h=`<h2>Choose a new password</h2></div><div class="mb">
      <form id="aForm" class="aform">${field('aPw','New password (at least 8 characters)','password','new-password')}<button class="btn cta" type="submit">Save new password</button></form>${msg}</div>`;
  } else {
    h=`<h2>Log in</h2></div><div class="mb">${notReady}
      <p class="small muted" style="margin:0">Log in to get your list on every device. EdTrack also works without an account.</p>
      <form id="aForm" class="aform">${field('aEmail','Email','email','email','you@example.com')}${field('aPw','Password','password','current-password')}
      <button class="btn cta" type="submit">Log in</button></form>
      ${msg}<p class="small" style="margin:0"><button class="linkbtn" data-av="reset">Forgot password?</button> · New here? <button class="linkbtn" data-av="signup">Create an account</button></p></div>`;
  }
  $('#modal').innerHTML=`<div class="mh"><button class="x" data-close="doc" aria-label="Close">×</button><div class="small muted">EdTrack account</div>${h}`;
  const say=(t,bad)=>{const m=$('#amsg'); if(m){m.textContent=t; m.classList.toggle('bad',!!bad);}};
  const f=$('#aForm');
  if(f) f.onsubmit=async e=>{ e.preventDefault(); const btn=f.querySelector('button[type=submit]'); 
    if(!acctReady()||!sb){ say('Accounts are not connected yet.',true); return; }
    const em=($('#aEmail')||{}).value, pw=($('#aPw')||{}).value;
    if(['signup','newpw'].includes(v)&&(pw||'').length<8){ say('Please choose a password with at least 8 characters.',true); return; }
    btn.disabled=true; say('One moment…');
    try{
      if(v==='login'){ const {error}=await sb.auth.signInWithPassword({email:em,password:pw}); if(error) throw error; toast('Logged in'); closeDoc(); }
      else if(v==='signup'){ const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:here}}); if(error) throw error;
        if(data.session){ toast('Account created'); closeDoc(); } else say('Almost done: we sent you an email. Click the link in it to confirm your address, then log in.'); }
      else if(v==='reset'){ const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:here}); if(error) throw error; say('If an account exists for this email, a reset link is on its way.'); }
      else if(v==='newpw'){ const {error}=await sb.auth.updateUser({password:pw}); if(error) throw error; toast('New password saved'); closeDoc(); }
    }catch(err){ say(AERR(err),true); }
    btn.disabled=false; };
  if($('#aOut')) $('#aOut').onclick=async()=>{ try{await sb.auth.signOut()}catch(e){}
    state.tracker={};state.compare=[];state.profile=blankProfile(); SYNC_KEYS.slice(0,3).forEach(k=>saveLocal(k,state[k]));
    closeDoc(); toast('Logged out. Your list is safe in your account.'); go('tracker'); };
  if($('#aDel1')) $('#aDel1').onclick=()=>{$('#aDelBox').hidden=false};
  if($('#aDel2')) $('#aDel2').onclick=async()=>{ try{ const {error}=await sb.rpc('delete_my_account'); if(error) throw error; await sb.auth.signOut({scope:'local'}).catch(()=>{});
      user=null; acctBtnDraw(); closeDoc(); toast('Your account was deleted'); }catch(err){ say(AERR(err),true); } };
}
function acctInit(){
  const b=$('#acctBtn'); if(!b) return;
  if(!acctReady()&&!inPreview) return;            // not configured: no account button on the public site
  b.hidden=false; acctBtnDraw(); b.onclick=()=>openAcct();
  if(!acctReady()) return;
  try{ sb=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'edtrack-auth'}}); }catch(e){ sb=null; return; }
  sb.auth.onAuthStateChange((ev,session)=>{
    const was=user&&user.id; user=session&&session.user||null; acctBtnDraw();
    if(ev==='PASSWORD_RECOVERY'){ openAcct('newpw'); return; }
    if(user&&user.id!==was) setTimeout(pullAndMerge,0);
  });
}

acctInit();
go(Object.keys(state.tracker).length?'todos':'tracker');
</script>
</body>
</html>
